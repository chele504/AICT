model:
  allow_online_model_download: false
  use_auxiliary_loss: true

train:
  target_column: "target_score"
  text_column: "review_text"
  image_column: null
  audio_column: null
  output_dir: "outputs_questionnaire"
  batch_size: 8
  epochs: 10
  val_ratio: 0.2
  random_seed: 42
  enable_augmentation: false
  mixed_precision: true
  early_stopping_patience: 5

report:
  enabled: true
  write_markdown: true
